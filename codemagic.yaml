workflows:
  ios-hotspot-plus:
    name: Build Hotspot Plus iOS IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: v20.11.0
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build web assets
        script: |
          npm run build
      - name: Sync Capacitor iOS and Install CocoaPods
        script: |
          npx cap sync ios
          cd ios/App
          pod install
      - name: Build iOS Archive and IPA
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            archive
            
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa
    artifacts:
      - ios/App/build/ipa/*.ipa
    publishing:
      email:
        recipients:
          - user@example.com
