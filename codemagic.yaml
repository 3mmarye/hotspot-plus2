workflows:
  ios-hotspot-plus:
    name: Build Unsigned Hotspot Plus IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: v20.11.0
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build web assets
        script: |
          npm run build
      - name: Sync Capacitor iOS and Install CocoaPods
        script: |
          npx cap sync ios
          cd ios/App
          pod install
      - name: Build iOS Archive Without Signing
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            archive
      - name: Generate Final IPA File
        script: |
          cd ios/App
          # تجهيز مجلد Payload الخاص بالـ IPA
          mkdir -p payload_dir/Payload
          
          # نسخ التطبيق المبني بداخله
          cp -r build/App.xcarchive/Products/Applications/App.app payload_dir/Payload/
          
          # ضغط المجلد بصيغة IPA حقيقية وبالاسم المطلوب
          cd payload_dir
          zip -r ../build/HotspotPlus.ipa Payload
          cd ../..
    artifacts:
      - ios/App/build/*.ipa
