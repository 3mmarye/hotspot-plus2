workflows:
  ios-hotspot-plus:
    name: Hotspot Plus iOS
    environment:
      xcode: latest
    scripts:
      - name: Install
        script: npm install
      - name: Build
        script: npm run build
      - name: Sync
        script: npx cap sync ios
      - name: Pods
        script: cd ios/App && pod install --repo-update
      - name: Archive
        script: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath "$CM_BUILD_DIR/HotspotPlus.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
      - name: IPA
        script: mkdir -p "$CM_BUILD_DIR/Payload" && cp -R "$CM_BUILD_DIR/HotspotPlus.xcarchive/Products/Applications/App.app" "$CM_BUILD_DIR/Payload/App.app" && cd "$CM_BUILD_DIR" && zip -qry HotspotPlus.ipa Payload
    artifacts:
      - "$CM_BUILD_DIR/HotspotPlus.ipa"
