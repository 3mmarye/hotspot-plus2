workflows:
  ios-hotspot-plus:
    name: Hotspot Plus iOS Build
    instance_type: mac_mini_m1
    environment:
      vars:
        BUNDLE_ID: "com.hotspotplus.app"
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Update Capacitor iOS
        script: |
          npx cap update ios
      - name: Build iOS App
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphoneos -configuration Release clean archive -archivePath build/App.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          mkdir -p build/ios/ipa
          xcrun xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build/ios/ipa -exportOptionsPlist ExportOptions.plist || true
    artifacts:
      - build/ios/ipa/**/*.ipa
      - ios/App/build/App.xcarchive
